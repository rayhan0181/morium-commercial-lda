<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Warehouse Billing</title><style>
:root{--blue:#155eef;--bg:#f4f6fb;--ink:#172033}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--ink)}header{background:#155eef;color:white;padding:18px 16px}header h1{margin:0;font-size:21px}header small{opacity:.9}.wrap{padding:12px;max-width:850px;margin:auto}.card{background:#fff;border-radius:12px;padding:14px;margin:0 0 12px;box-shadow:0 2px 10px #1720330d}h2{font-size:17px;margin:0 0 12px}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}label{display:block;font-size:12px;color:#586174;margin:8px 0 4px}input,select,button{font:inherit;border-radius:8px;padding:11px;border:1px solid #d6dbe5;width:100%;background:white}button{background:var(--blue);border:0;color:white;font-weight:700;cursor:pointer;margin-top:8px}.secondary{background:#e9efff;color:#1646aa}.danger{background:#b42318}.muted{color:#667085;font-size:12px}.productline{display:grid;grid-template-columns:1fr 70px 95px 35px;gap:6px;align-items:center;margin:8px 0}.productline input{padding:9px}.productline .remove{background:#fee4e2;color:#b42318;padding:8px}.total{font-size:20px;font-weight:800;text-align:right;margin:12px 0}.pill{display:inline-block;background:#e9efff;color:#1646aa;border-radius:30px;padding:4px 9px;font-size:12px}.billitem{border-top:1px solid #eee;padding:10px 0}.hidden{display:none}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.historyactions{display:flex;gap:8px}.historyactions button{font-size:12px}.smallbtn{padding:8px;margin-top:0}.foot{text-align:center;color:#778094;font-size:11px;padding:10px}@media(min-width:600px){.wrap{padding:20px}.productline{grid-template-columns:1fr 100px 130px 40px}}
</style></head><body><header><h1>Warehouse Billing</h1><small>Sales bills · Mozambique Metical (MT)</small></header><main class="wrap">
<section class="card"><h2>1. Product list</h2><div class="row"><div><label>Product name</label><input id="pname" placeholder="e.g. Rice 1kg"></div><div><label>Selling price (MT)</label><input id="pprice" type="number" min="0" step="0.01" placeholder="0.00"></div></div><button onclick="addProduct()">＋ Add product</button><label>Search products</label><input id="search" placeholder="Search by product name" oninput="renderProducts()"><div id="products"></div><p class="muted">Prices and products are saved on this phone.</p></section>
<section class="card"><h2>2. Create customer bill</h2><div class="two"><div><label>Customer name</label><input id="customer" placeholder="Customer name"></div><div><label>Phone (optional)</label><input id="phone" type="tel" placeholder="Phone number"></div></div><div class="row"><div><label>Bill number</label><input id="billno"></div><div><label>Date</label><input id="billdate" type="date"></div></div><label>Add product to bill</label><select id="chooseProduct"><option value="">Select a product…</option></select><button class="secondary" onclick="addLine()">＋ Add to bill</button><div id="lines"></div><div class="row"><div><label>Discount (MT)</label><input id="discount" type="number" min="0" step="0.01" value="0" oninput="calc()"></div><div><label>Paid amount (MT)</label><input id="paid" type="number" min="0" step="0.01" value="0" oninput="calc()"></div></div><div id="totals"></div><button onclick="saveBill()">Save bill</button><button class="secondary" onclick="printBill()">Print / Save PDF</button><button class="secondary" onclick="clearBill()">Clear bill</button></section>
<section class="card"><h2>3. Bill history</h2><button class="secondary" onclick="exportCSV()">Export bills to CSV</button><div id="history"></div></section><div class="foot">Warehouse Billing · Data stays on this device. Export a backup regularly.</div></main>
<script>
const $=id=>document.getElementById(id);let products=JSON.parse(localStorage.getItem('wb_products')||'[]'),bills=JSON.parse(localStorage.getItem('wb_bills')||'[]'),lines=[];function money(n){return (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' MT'}function today(){return new Date().toISOString().slice(0,10)}function newNo(){return 'WB-'+Date.now().toString().slice(-8)}$('billno').value=newNo();$('billdate').value=today();
function persist(){localStorage.setItem('wb_products',JSON.stringify(products));localStorage.setItem('wb_bills',JSON.stringify(bills));renderProducts();renderHistory()}
function addProduct(){let name=$('pname').value.trim(),price=Number($('pprice').value);if(!name||$('pprice').value===''||price<0)return alert('Enter product name and a valid price.');products.push({id:Date.now()+Math.random(),name,price});$('pname').value='';$('pprice').value='';persist()}
function renderProducts(){let q=($('search').value||'').toLowerCase();$('products').innerHTML=products.filter(p=>p.name.toLowerCase().includes(q)).map(p=>`<div class="billitem"><b>${esc(p.name)}</b> <span class="pill">${money(p.price)}</span><button class="danger smallbtn" style="width:auto;float:right" onclick="delProduct(${p.id})">Delete</button><div style="clear:both"></div></div>`).join('')||'<p class="muted">No products added yet.</p>';let old=$('chooseProduct').value;$('chooseProduct').innerHTML='<option value="">Select a product…</option>'+products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${money(p.price)}</option>`).join('');$('chooseProduct').value=old}
function delProduct(id){if(confirm('Delete this product from the product list?')){products=products.filter(p=>p.id!=id);persist()}}
function addLine(){let p=products.find(x=>x.id==$('chooseProduct').value);if(!p)return alert('Please select a product.');let existing=lines.find(x=>x.id===p.id);if(existing)existing.qty++;else lines.push({...p,qty:1});renderLines()}
function renderLines(){$('lines').innerHTML=lines.map((l,i)=>`<div class="productline"><div><b>${esc(l.name)}</b><div class="muted">${money(l.price)} each</div></div><input aria-label="Quantity" type="number" min="1" value="${l.qty}" onchange="setQty(${i},this.value)"><div style="text-align:right;font-weight:bold">${money(l.qty*l.price)}</div><button class="remove" onclick="removeLine(${i})">×</button></div>`).join('');calc()}
function setQty(i,v){lines[i].qty=Math.max(1,parseInt(v)||1);renderLines()}function removeLine(i){lines.splice(i,1);renderLines()}function calc(){let subtotal=lines.reduce((s,l)=>s+l.price*l.qty,0),discount=Math.max(0,Number($('discount').value)||0),total=Math.max(0,subtotal-discount),paid=Math.max(0,Number($('paid').value)||0);$('totals').innerHTML=`<div class="billitem">Subtotal <b style="float:right">${money(subtotal)}</b></div><div class="billitem">Total <b style="float:right">${money(total)}</b></div><div class="billitem">Paid <b style="float:right">${money(paid)}</b></div><div class="total">Balance: ${money(Math.max(0,total-paid))}</div>`;return {subtotal,discount,total,paid,balance:Math.max(0,total-paid)}}
function getBill(){if(!lines.length)throw Error('Add at least one product to the bill.');let c=calc();return {id:Date.now(),no:$('billno').value.trim()||newNo(),date:$('billdate').value||today(),customer:$('customer').value.trim()||'Walk-in customer',phone:$('phone').value.trim(),lines:JSON.parse(JSON.stringify(lines)),...c}}
function saveBill(){try{let b=getBill();let i=bills.findIndex(x=>x.no===b.no);if(i>=0){if(!confirm('This bill number exists. Replace it?'))return;bills[i]=b}else bills.unshift(b);persist();alert('Bill saved successfully.');$('billno').value=newNo();}catch(e){alert(e.message)}}
function clearBill(){if(confirm('Clear the current bill?')){lines=[];$('customer').value='';$('phone').value='';$('discount').value='0';$('paid').value='0';$('billno').value=newNo();$('billdate').value=today();renderLines()}}
function printBill(){try{let b=getBill(),w=window.open('','_blank');if(!w){alert('Pop-up blocked. Please allow pop-ups to print or save as PDF.');return}w.document.write(`<html><head><title>${esc(b.no)}</title><style>body{font:14px Arial;padding:25px;color:#111}h1{margin-bottom:3px}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left}td:last-child,th:last-child{text-align:right}.right{text-align:right}.meta{line-height:1.8}</style></head><body><h1>Warehouse Billing</h1><div>Sales invoice · Mozambique Metical (MT)</div><hr><div class="meta"><b>Bill:</b> ${esc(b.no)}<br><b>Date:</b> ${esc(b.date)}<br><b>Customer:</b> ${esc(b.customer)}<br><b>Phone:</b> ${esc(b.phone||'—')}</div><table><thead><tr><th>Product</th><th>Qty</th><th>Unit price</th><th>Total</th></tr></thead><tbody>${b.lines.map(l=>`<tr><td>${esc(l.name)}</td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td></tr>`).join('')}</tbody></table><div class="right" style="margin-top:20px;line-height:2">Subtotal: ${money(b.subtotal)}<br>Discount: ${money(b.discount)}<br><b>Total: ${money(b.total)}</b><br>Paid: ${money(b.paid)}<br><b>Balance: ${money(b.balance)}</b></div><p style="margin-top:40px">Thank you!</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}catch(e){alert(e.message)}}
function renderHistory(){$('history').innerHTML=bills.map(b=>`<div class="billitem"><b>${esc(b.no)}</b> · ${esc(b.date)}<br>${esc(b.customer)}<br><b>${money(b.total)}</b> <span class="muted">Balance ${money(b.balance)}</span><div class="historyactions"><button class="secondary smallbtn" onclick="reprint(${b.id})">Print</button><button class="danger smallbtn" onclick="deleteBill(${b.id})">Delete</button></div></div>`).join('')||'<p class="muted">No saved bills yet.</p>'}function reprint(id){let b=bills.find(x=>x.id===id);if(!b)return;let save=lines,old=[$('billno').value,$('billdate').value,$('customer').value,$('phone').value,$('discount').value,$('paid').value];lines=JSON.parse(JSON.stringify(b.lines));$('billno').value=b.no;$('billdate').value=b.date;$('customer').value=b.customer;$('phone').value=b.phone;$('discount').value=b.discount;$('paid').value=b.paid;printBill();lines=save;[$('billno').value,$('billdate').value,$('customer').value,$('phone').value,$('discount').value,$('paid').value]=old;renderLines()}function deleteBill(id){if(confirm('Delete this saved bill?')){bills=bills.filter(b=>b.id!==id);persist()}}
function exportCSV(){if(!bills.length)return alert('No bills to export.');let rows=[['Bill No','Date','Customer','Phone','Subtotal MT','Discount MT','Total MT','Paid MT','Balance MT','Products'],...bills.map(b=>[b.no,b.date,b.customer,b.phone,b.subtotal,b.discount,b.total,b.paid,b.balance,b.lines.map(l=>`${l.name} x${l.qty}`).join('; ')])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download='warehouse-bills.csv';a.click();URL.revokeObjectURL(a.href)}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}renderProducts();renderHistory();renderLines();
</script></body></html>
